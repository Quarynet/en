<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/icon.png">
    <title>Q-Raster Games | Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="brand">
            <a href="index.html">
                <img src="assets/logo.png" class="brand-logo" alt="Q-Raster Games">
            </a>
        </div>
        <nav>
            <a href="index.html" class="active">GAMES</a>
            <a href="about.html">ABOUT Q-RASTER GAMES</a>
        </nav>
    </header>

    <div class="container">
        <div id="featured-container"></div>

        <div class="filter-header">
            <div class="page-title-clean">All Projects</div>
            <div class="filter-tabs" id="filter-tabs">
                <a href="#" class="tab active" data-category="ALL">ALL</a>
                <a href="#" class="tab" data-category="DESKTOP">DESKTOP</a>
                <a href="#" class="tab" data-category="MOBILE">MOBILE</a>
                <a href="#" class="tab" data-category="WEB">WEB</a>
                <a href="#" class="tab" data-category="DEMOS">DEMOS</a>
            </div>
        </div>

        <div class="game-list" id="games-container"></div>
    </div>

    <footer>
        &copy; 2026 Q-Raster Games. This website uses Cloudflare Pages.
    </footer>

    <script src="games.js"></script>

    <script>
        const featuredContainer = document.getElementById('featured-container');
        const gamesContainer = document.getElementById('games-container');
        const filterTabs = document.getElementById('filter-tabs');

        const featuredGame = gameData.find(g => g.isFeatured) || gameData[0];
        
        function renderThumb(src, defaultText) {
            return src 
                ? `<img src="${src}" alt="Cover" style="width:100%; height:100%; object-fit:cover;">`
                : defaultText;
        }

        featuredContainer.innerHTML = `
            <div class="featured-hero">
                <div class="featured-thumb">
                    ${renderThumb(featuredGame.heroBanner || featuredGame.thumb, '[ FEATURED SHOWCASE COVER 400x220 ]')}
                </div>
                <div class="featured-details">
                    <div>
                        <span class="spotlight-label">FEATURED GAME &bull; ${featuredGame.year}</span>
                        <h2 class="featured-title">${featuredGame.title}</h2>
                        <p class="featured-desc">${featuredGame.descHero || featuredGame.descList}</p>
                    </div>
                    <div class="featured-action">
                        <span class="featured-price ${featuredGame.priceClass}">${featuredGame.price}</span>
                        <a href="gamepage.html?id=${featuredGame.id}" class="btn-play">${featuredGame.btnTextHero || featuredGame.btnTextList}</a>
                    </div>
                </div>
            </div>
        `;

        function renderGames(categoryFilter = 'ALL') {
            const filteredGames = categoryFilter === 'ALL' 
                ? gameData 
                : gameData.filter(game => game.categories && game.categories.includes(categoryFilter));

            if (filteredGames.length === 0) {
                gamesContainer.innerHTML = `
                    <div style="padding: 32px; text-align: center; color: var(--text-subtle); background-color: var(--bg-card); border: 1px solid var(--border-color);">
                        Nothing Found.
                    </div>
                `;
                return;
            }

            gamesContainer.innerHTML = filteredGames.map(game => `
                <div class="game-row">
                    <div class="game-thumb">
                        ${renderThumb(game.thumb, '[ 220 x 125 COVER ]')}
                    </div>
                    <div class="game-details">
                        <div>
                            <div class="game-header">
                                <div>
                                    <span class="game-title">${game.title}</span>
                                    <span class="status-tag ${game.tagClass}">${game.tagText}</span>
                                </div>
                                <span class="price-badge ${game.priceClass}">${game.price}</span>
                            </div>
                            <div class="game-description">${game.descList}</div>
                        </div>
                        <div class="game-footer">
                            <span class="platform-list">${game.year} &bull; ${game.platforms}</span>
                            <a href="gamepage.html?id=${game.id}" class="btn-play">${game.btnTextList}</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        filterTabs.addEventListener('click', (e) => {
            if (e.target.classList.contains('tab')) {
                e.preventDefault();
                
                document.querySelectorAll('.filter-tabs .tab').forEach(tab => tab.classList.remove('active'));
                e.target.classList.add('active');

                const category = e.target.getAttribute('data-category');
                renderGames(category);
            }
        });

        renderGames('ALL');
    </script>
</body>
</html>
