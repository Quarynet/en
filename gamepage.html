<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/icon.png">
    <title>Q-Raster Games | Loading...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .download-panel {
            display: none;
            margin-top: var(--offset-md);
            padding: var(--offset-md);
            background-color: var(--bg-body);
            border: 1px solid var(--border-color);
        }

        .download-panel.active {
            display: block;
        }

        .download-panel-title {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: var(--offset-sm);
        }

        .download-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: var(--offset-sm);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <a href="index.html">
                <img src="assets/logo.png" class="brand-logo" alt="Q-Raster Games">
            </a>
        </div>
        <nav>
            <a href="index.html">GAMES</a>
            <a href="about.html">ABOUT Q-RASTER GAMES</a>
        </nav>
    </header>

    <div class="container">
        <div style="margin-bottom: var(--offset-md);">
            <a href="index.html" style="font-size: 12px; color: var(--text-muted);">&larr; BACK TO ALL GAMES</a>
        </div>

        <div id="game-page-content"></div>
    </div>

    <footer>
        &copy; 2026 Q-Raster Games. This website uses Github Pages.
    </footer>

    <script src="games.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('id');

        const selectedGame = gameData.find(game => game.id === gameId);
        const container = document.getElementById('game-page-content');

        if (selectedGame) {
            document.title = `${selectedGame.title} | Q-Raster Games`;

            const downloadButtonsHtml = selectedGame.downloads ? selectedGame.downloads.map(dl => `
                <a href="${dl.url}" class="btn-play">Download for ${dl.name}</a>
            `).join('') : '';

            const heroImageSrc = selectedGame.heroBanner || selectedGame.thumb;
            const heroContent = heroImageSrc 
                ? `<img src="${heroImageSrc}" alt="${selectedGame.title}" style="width:100%; height:100%; object-fit:cover;">`
                : `[ ${selectedGame.title} HERO BANNER 800x320 ]`;

            const actionButtonHtml = selectedGame.isAvailable 
                ? `<a href="#" id="toggle-downloads-btn" class="btn-play">GET GAME NOW</a>`
                : `<a href="#" class="btn-play disabled">UNAVAILABLE</a>`;

            const dateLabel = selectedGame.tagClass === 'in-development' ? 'Planned' : 'Released';

            container.innerHTML = `
                <div class="featured-hero" style="flex-direction: column; gap: var(--offset-md);">
                    <div class="featured-thumb" style="width: 100%; height: 320px; font-size: 16px;">
                        ${heroContent}
                    </div>
                    <div class="game-details">
                        <div class="game-header" style="margin-bottom: var(--offset-md);">
                            <div>
                                <h1 class="featured-title">${selectedGame.title}</h1>
                                <span class="status-tag ${selectedGame.tagClass}">${selectedGame.tagText}</span>
                            </div>
                            <span class="featured-price ${selectedGame.priceClass}">${selectedGame.price}</span>
                        </div>

                        <p class="featured-desc" style="font-size: 14px; margin-bottom: var(--offset-lg);">
                            ${selectedGame.descList}
                        </p>

                        <div class="game-footer" style="border-top: 1px solid var(--border-color); padding-top: var(--offset-md);">
                            <span class="platform-list">${dateLabel}: ${selectedGame.year} | Platforms: ${selectedGame.platforms}</span>
                            ${actionButtonHtml}
                        </div>

                        ${selectedGame.isAvailable ? `
                            <div id="download-panel" class="download-panel">
                                <div class="download-panel-title">Select Platform</div>
                                <div class="download-buttons">
                                    ${downloadButtonsHtml}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;

            if (selectedGame.isAvailable) {
                const toggleBtn = document.getElementById('toggle-downloads-btn');
                const panel = document.getElementById('download-panel');

                toggleBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    panel.classList.toggle('active');
                });
            }
        } else {
            document.title = "Game Not Found | Q-Raster Games";
            container.innerHTML = `
                <div style="padding: 32px; text-align: center; color: var(--text-subtle); background-color: var(--bg-card); border: 1px solid var(--border-color);">
                    Game Not Found.
                </div>
            `;
        }
    </script>
</body>
</html>
